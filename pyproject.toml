[project]
name = "skypro-cli-tool"
version = "0.3.3"
description = "SkyPro cli tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "typer>=0.25.0",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "ipython>=9.13.0",
]
test = [
    "freezegun>=1.5.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "pytest-mock>=3.15.1",
]
lint = [
    "mypy>=2.3.0",
    "ruff>=0.15.12",
    "typos>=1.48.0",
]

[project.scripts]
sky-cli = "skypro.main:main"

[tool.ruff]
target-version = "py313"
line-length = 88
respect-gitignore = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "CPY001", # Missing copyright notice at top of file
    "COM812", # Trailing comma missing
    "D", # Rules about docstrings
    "DOC", # Rules about docstrings
    "EM101", # Exception must not use a string literal, assign to variable first
    "EM102", # Exception must not use an f-string literal, assign to variable first
    "TRY003", # Avoid specifying long messages outside the exception class
    "RUF001", # String contains ambiguous symbol
]
select = ["ALL"]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN", # Missing type annotation
    "S101", # Use of `assert` detected
    "PLR6301", # Method could be a function, class method, or static method
    "S105", #  Possible hardcoded password
    "S106", #  Possible hardcoded password
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
    "PLR2004", # Magic value used in comparison
    "RUF069", # Unreliable floating point equality comparison
]
"*/cli/app.py" = [
    "FBT001", # Boolean-typed positional argument in function definition
    "FBT003", # Boolean positional value in function call
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.pytest]
asyncio_mode = "auto"
asyncio_debug = true
addopts = ["--cov=src", "--cov-report", "term-missing"]

[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    ".venv/*",
    ".github",
    "*/main.py",
    "*/config/logging.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "skypro"
module-root = "src"

[tool.mypy]
show_error_codes = true
ignore_missing_imports = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_no_return = false
warn_unreachable = true
no_implicit_optional = true
allow_redefinition = true
exclude_gitignore = true
plugins = ["pydantic.mypy"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ['tests.*']
allow_untyped_defs = true
disable_error_code = [
    "no-untyped-def", #  Function is missing a type annotation
]
