name: workflow

on: push

env:
  SKYPRO__EMAIL: test@example.com
  SKYPRO__PASSWORD: test-password
  LOG_LEVEL: DEBUG

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.13
      - name: Install the project
        run: uv sync --frozen --group lint
      - name: Check linters
        run: uv run make check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install required locale
        run: |
          sudo locale-gen ru_RU.UTF-8
          sudo update-locale
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.13
      - name: Install the project
        run: uv sync --frozen --group test
      - name: Run tests
        run: uv run make test
